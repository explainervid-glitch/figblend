<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  .pair { position: absolute; left: 120px; right: 120px; top: 360px; bottom: 60px;
          display: grid; grid-template-columns: 1fr 160px 1fr; align-items: center; }
  .panel { border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
           display: flex; flex-direction: column; font-size: 26px; }
  .panel .head { padding: 22px 28px; font-weight: 600; font-size: 24px; color: var(--muted);
                 border-bottom: 1px solid var(--line); }
  .panel .rows { padding: 12px 0; }
  .r { height: 58px; display: flex; align-items: center; gap: 16px; padding: 0 28px; }
  .r .ic { width: 30px; text-align: center; font-weight: 700; color: var(--muted); font-size: 22px; }
  .r .kind { margin-left: auto; font-size: 20px; color: var(--muted); }
  .figma { background: #2c2c2c; }
  .blender { background: #282828; }
  .blender .r:nth-child(odd) { background: #2b2b2b; }
  .arrow { display: flex; align-items: center; justify-content: center; }
  .arrow svg { width: 90px; height: 90px; stroke: var(--muted); stroke-width: 2; fill: none;
               stroke-linecap: round; stroke-linejoin: round; }
  .i1 { padding-left: 64px; } .i2 { padding-left: 100px; }
  .col-ic { color: #e8e8e8 !important; } .txt-ic { color: #f5792a !important; }
  .crv-ic { color: #3d8bff !important; } .img-ic { color: #a259ff !important; }
</style>
</head><body>
<div class="frame">
  <div class="eyebrow">Hierarchy and text</div>
  <h1>It stays editable.</h1>
</div>
<div class="pair">
  <div class="panel figma">
    <div class="head">Figma layers</div>
    <div class="rows">
      <div class="r"><span class="ic">#</span>Dashboard</div>
      <div class="r i1"><span class="ic">#</span>Profile card</div>
      <div class="r i2"><span class="ic">▣</span>Cover photo</div>
      <div class="r i2"><span class="ic">◯</span>Avatar</div>
      <div class="r i2"><span class="ic">T</span>Jane Cooper</div>
      <div class="r i2"><span class="ic">T</span>Product designer</div>
      <div class="r i2"><span class="ic">▭</span>Follow button</div>
    </div>
  </div>
  <div class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></div>
  <div class="panel blender">
    <div class="head">Blender outliner</div>
    <div class="rows">
      <div class="r"><span class="ic col-ic">▤</span>Dashboard<span class="kind">collection</span></div>
      <div class="r i1"><span class="ic col-ic">▤</span>Profile card<span class="kind">collection</span></div>
      <div class="r i2"><span class="ic img-ic">▣</span>Cover photo<span class="kind">image</span></div>
      <div class="r i2"><span class="ic crv-ic">◯</span>Avatar<span class="kind">curve</span></div>
      <div class="r i2"><span class="ic txt-ic">a</span>Jane Cooper<span class="kind">text</span></div>
      <div class="r i2"><span class="ic txt-ic">a</span>Product designer<span class="kind">text</span></div>
      <div class="r i2"><span class="ic crv-ic">▭</span>Follow button<span class="kind">curve</span></div>
    </div>
  </div>
</div>
</body></html>
