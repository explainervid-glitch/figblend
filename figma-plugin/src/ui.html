<style>
  * { box-sizing: border-box; }
  body {
    font: 11px/1.45 Inter, -apple-system, sans-serif;
    background: var(--figma-color-bg, #2c2c2c);
    color: var(--figma-color-text, #e6e6e6);
    margin: 0;
    padding: 10px;
    -webkit-font-smoothing: antialiased;
  }

  /* Lucide glyphs, inlined -- the plugin sandbox blocks every external request */
  .ic {
    width: 13px; height: 13px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .ic-lg { width: 15px; height: 15px; }

  /* Everything visible lives in #app. Its height, not the body's, sizes the
     plugin window: tooltips are absolutely positioned inside it, so they never
     count towards it and the window does not jump when one appears. */
  #app { position: relative; display: flex; flex-direction: column; gap: 8px; }

  header { display: flex; align-items: center; gap: 6px; }
  header .grow { flex: 1; }
  /* Settings toggle: an icon only, tinted when the log holds an unseen error */
  .iconbtn {
    width: 26px; height: 24px; padding: 0; border-radius: 6px;
    background: transparent; color: var(--figma-color-text-secondary, #a0a0a0);
  }
  .iconbtn:hover, .iconbtn.on { color: var(--figma-color-text, #e6e6e6); background: var(--figma-color-bg-secondary, #383838); }
  .iconbtn.alert { color: var(--figma-color-text-danger, #ff9d9d); }

  /* Live-link state in one word; the pill itself turns green when paired */
  .pill {
    height: 20px; padding: 0 9px; gap: 4px;
    border-radius: 10px; font-weight: 500;
    background: var(--figma-color-bg-secondary, #383838);
    color: var(--figma-color-text-secondary, #a0a0a0);
  }
  .pill:hover { color: var(--figma-color-text, #e6e6e6); }
  .pill.found { color: var(--figma-color-text-warning, #f3c11b); }
  .pill.paired { background: #14ae5c; color: #ffffff; }
  .pill.paired:hover { background: #129c52; color: #ffffff; }
  .pill .ic-sm { width: 10px; height: 10px; }
  /* A newer release exists. Present only then, so it reads as news */
  .pill.upd { color: var(--figma-color-text-brand, #0d99ff); }
  .pill.upd:hover { color: var(--figma-color-text, #e6e6e6); }

  /* The three output modes are mutually exclusive, so they read as one choice */
  .seg {
    position: relative;            /* tooltips span the whole control */
    display: flex; gap: 2px; padding: 2px;
    border: 1px solid var(--figma-color-border, rgba(255,255,255,.12));
    border-radius: 7px;
  }
  .seg button {
    flex: 1; height: 26px; padding: 0 4px; gap: 5px; border-radius: 5px;
    background: transparent;
    color: var(--figma-color-text-secondary, #a0a0a0);
    font-weight: 500;
  }
  .seg button:hover { color: var(--figma-color-text, #e6e6e6); }
  .seg button.on {
    background: var(--figma-color-bg-brand, #0d99ff);
    color: var(--figma-color-text-onbrand, #ffffff);
    font-weight: 600;
  }

  /* Scale takes the room it needs for its label; quality is just its value */
  .opts { position: relative; display: flex; gap: 6px; }
  .field {
    display: flex; align-items: center; gap: 4px;
    height: 28px; padding: 0 3px 0 8px; min-width: 0;
    border: 1px solid var(--figma-color-border, rgba(255,255,255,.12));
    border-radius: 6px; cursor: help;
    color: var(--figma-color-text-secondary, #a0a0a0);
  }
  .field.wide { flex: 1; }
  .field:focus-within { border-color: var(--figma-color-border-selected, #0d99ff); }
  input[type=number] {
    width: 40px; flex: none; height: 22px; padding: 0 2px;
    border: 0; background: transparent; text-align: right;
    color: var(--figma-color-text, #e6e6e6);
    font: inherit; font-variant-numeric: tabular-nums; cursor: text;
    -moz-appearance: textfield;
  }
  /* The browser's own spin arrows ignore the theme; ours replace them */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number]:focus { outline: none; }
  .unit { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .stepper { display: flex; flex-direction: column; gap: 1px; flex: none; }
  .stepper button {
    width: 16px; height: 10px; padding: 0; border-radius: 3px;
    background: transparent; color: var(--figma-color-text-secondary, #a0a0a0);
  }
  .stepper button:hover {
    color: var(--figma-color-text, #e6e6e6);
    background: var(--figma-color-bg-secondary, #383838);
  }
  .stepper .ic { width: 10px; height: 10px; stroke-width: 2.5; }

  /* A themed dropdown; the native select opens a system-coloured list */
  button.dd {
    height: 22px; padding: 0 4px 0 6px; gap: 4px; border-radius: 4px;
    background: transparent; color: var(--figma-color-text, #e6e6e6);
    font-weight: 400; font-variant-numeric: tabular-nums;
  }
  button.dd:hover, button.dd.open { background: var(--figma-color-bg-secondary, #383838); }
  button.dd .ic { width: 11px; height: 11px; color: var(--figma-color-text-secondary, #a0a0a0); }

  .menu {
    position: absolute; z-index: 40; padding: 4px;
    display: flex; flex-direction: column; gap: 1px;
    background: var(--figma-color-bg, #2c2c2c);
    border: 1px solid var(--figma-color-border, rgba(255,255,255,.12));
    border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .menu button {
    justify-content: space-between; gap: 14px;
    height: 24px; padding: 0 8px; border-radius: 5px;
    background: transparent; color: var(--figma-color-text, #e6e6e6);
    font-weight: 400; white-space: nowrap;
  }
  .menu button:hover, .menu button:focus-visible {
    outline: none; background: var(--figma-color-bg-brand, #0d99ff);
    color: var(--figma-color-text-onbrand, #ffffff);
  }
  .menu button.sel { font-weight: 600; }
  .menu button em { font-style: normal; opacity: .6; }

  .brand { display: flex; align-items: center; gap: 7px; }
  .brand img { width: 18px; height: 18px; border-radius: 4px; }

  /* Detail lives in tooltips so the panel stays scannable. They stretch to
     the width of the row they belong to, so they cannot run off the edge. */
  [data-tip]::after {
    content: attr(data-tip);
    position: absolute; left: 0; right: 0; z-index: 20;
    top: calc(100% + 6px);
    padding: 6px 8px;
    background: var(--figma-color-bg-inverse, #1e1e1e);
    color: var(--figma-color-text-oninverse, #fff);
    border-radius: 6px; font-weight: 400; line-height: 1.4; text-align: left;
    white-space: normal;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
    opacity: 0; visibility: hidden; transition: opacity .1s ease .3s;
    pointer-events: none;
  }
  [data-tip].up::after { top: auto; bottom: calc(100% + 6px); }
  [data-tip]:hover::after { opacity: 1; visibility: visible; }

  button {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 12px; border: 0; border-radius: 6px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  #export { background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #ffffff); }
  #export:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: default; }

  /* Settings: version, the matching Blender add-on, and the full log */
  #settings {
    display: flex; flex-direction: column; gap: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--figma-color-border, rgba(255,255,255,.12));
  }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ver { color: var(--figma-color-text-secondary, #a0a0a0); font-variant-numeric: tabular-nums; }
  button.ghost {
    height: 26px; padding: 0 10px; gap: 6px; font-weight: 500;
    background: transparent; color: var(--figma-color-text, #e6e6e6);
    border: 1px solid var(--figma-color-border, rgba(255,255,255,.12));
  }
  button.ghost:hover:not(:disabled) { background: var(--figma-color-bg-secondary, #383838); }
  .log {
    max-height: 150px; overflow-y: auto; padding: 6px 8px;
    border-radius: 6px; background: var(--figma-color-bg-secondary, #383838);
    font-size: 10.5px; line-height: 1.45;
    color: var(--figma-color-text-secondary, #a0a0a0);
    white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; cursor: text;
  }
  .log .t { opacity: .55; font-variant-numeric: tabular-nums; }
  .log .w { color: var(--figma-color-text-warning, #f3c11b); }
  .log .e { color: var(--figma-color-text-danger, #ff9d9d); }
  .log .empty { opacity: .7; }
  .hidden { display: none !important; }
</style>

<div id="app">
<!-- No title: Figma's own window bar already names the plugin. -->
<header>
  <button type="button" class="pill" id="link" title="Check for a running Blender">
    <span id="linkText">Offline</span><svg class="ic ic-sm hidden" id="linkMore" viewBox="0 0 24 24"><use href="#i-down"/></svg>
  </button>
  <span class="grow"></span>
  <button type="button" class="pill upd hidden" id="update">
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-up"/></svg><span id="updateText"></span>
  </button>
  <button type="button" class="iconbtn" id="settingsBtn" title="Settings and log" aria-expanded="false">
    <svg class="ic ic-lg" viewBox="0 0 24 24"><use href="#i-gear"/></svg>
  </button>
</header>

<div class="seg" id="modeSeg">
  <button type="button" data-mode="vector"
          data-tip="Curves and editable text. Sharp at any distance. Gradients and images become textures.">
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-pen"/></svg> Vector
  </button>
  <button type="button" class="on" data-mode="texvector"
          data-tip="Curves wearing a render of themselves. Keeps gradients and shadows on real geometry.">
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-image"/></svg> Texturized
  </button>
  <button type="button" data-mode="image"
          data-tip="Everything baked to textured planes, text included. Nothing editable, no fonts needed.">
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-type"/></svg> Image
  </button>
</div>

<div class="opts">
  <label class="field wide up" data-tip="Figma pixels in one Blender metre. At 1000, a 1440 px frame is 1.44 m wide in Blender.">
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-scan"/></svg>
    <input id="pxPerMeter" type="number" value="1000" min="1" step="100" />
    <span class="unit">Pixel per Meter</span>
    <span class="stepper">
      <button type="button" data-step="1" aria-label="More pixels per meter"><svg class="ic" viewBox="0 0 24 24"><use href="#i-up-chev"/></svg></button>
      <button type="button" data-step="-1" aria-label="Fewer pixels per meter"><svg class="ic" viewBox="0 0 24 24"><use href="#i-down"/></svg></button>
    </span>
  </label>
  <div class="field up" id="qualityTip" data-tip="">
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-image"/></svg>
    <button type="button" class="dd" id="rasterScale" data-value="2" aria-haspopup="listbox">
      <span id="rasterText">2×</span><svg class="ic" viewBox="0 0 24 24"><use href="#i-down"/></svg>
    </button>
  </div>
</div>

<button id="export">
  <svg class="ic" viewBox="0 0 24 24"><use href="#i-download"/></svg> Export
</button>

<script>
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsEl = document.getElementById('settings');
  const logEl = document.getElementById('log');
  const versionEl = document.getElementById('version');
  const getAddonBtn = document.getElementById('getAddon');
  const exportBtn = document.getElementById('export');
  const modeSeg = document.getElementById('modeSeg');
  const qualityTip = document.getElementById('qualityTip');
  const linkBtn = document.getElementById('link');
  const linkText = document.getElementById('linkText');
  const linkMore = document.getElementById('linkMore');

  // The Blender addon serves this on loopback when Live Link is on. If it is
  // not there we simply fall back to downloading the .zip, so the plugin works
  // exactly as before with no Blender running.
  // Hostnames must match manifest allowedDomains exactly. Figma rejects IP
  // literals there, so this is the name -- Blender listens on both ::1 and
  // 127.0.0.1 because localhost resolves to the IPv6 one first on Windows.
  //
  // Each Blender claims the next free port, so several run side by side. Every
  // port has to be listed: Figma's allowedDomains wildcard covers subdomains,
  // not ports.
  const BRIDGE_PORTS = [8787, 8788, 8789, 8790, 8791, 8792, 8793, 8794];
  const SCAN_TIMEOUT = 700;

  let instances = [];  // every Blender that answered
  let bridge = null;   // the one we send to

  // /import needs a token. /pair gives one out only while Blender has a pairing
  // window open, so a web page that loads later cannot get one and cannot push
  // anything into the scene. Blender keeps its token on disk and every Blender
  // on the machine shares it, so one stored token pairs with all of them, across
  // restarts of either app. It lives in clientStorage, which the main thread
  // owns; these two helpers are the round trip to it.
  const tokens = {};
  const tokenWaiters = {};

  function tokenKey() { return 'machine'; }

  function loadToken(key) {
    if (key in tokens) return Promise.resolve(tokens[key]);
    if (!tokenWaiters[key]) {
      tokenWaiters[key] = new Promise((resolve) => {
        tokenWaiters[key + ':resolve'] = resolve;
      });
      parent.postMessage({ pluginMessage: { type: 'token-get', key } }, '*');
    }
    return tokenWaiters[key];
  }

  function storeToken(key, value) {
    tokens[key] = value;
    parent.postMessage({ pluginMessage: { type: 'token-set', key, value } }, '*');
  }

  // Ask Blender for a token. Succeeds only while its pairing window is open.
  async function pair(info) {
    try {
      const res = await fetch(info.url + '/pair', { method: 'POST' });
      const body = await res.json().catch(() => ({}));
      if (res.ok && body.token) {
        storeToken(tokenKey(info), body.token);
        return body.token;
      }
      return null;
    } catch (err) {
      return null;
    }
  }

  async function probe(port) {
    const url = 'http://localhost:' + port;
    const stop = new AbortController();
    const timer = setTimeout(() => stop.abort(), SCAN_TIMEOUT);
    try {
      let info = await ping(url, stop.signal, null);
      if (!info) return null;

      // Unpaired: take the token now if Blender is still offering one, then
      // ping again so this instance reports its real name and asset folder.
      if (!info.paired) {
        const stored = await loadToken(tokenKey());
        let token = stored;
        if (!token && info.pairing_open) token = await pair({ url, pid: info.pid });
        if (token) {
          const confirmed = await ping(url, stop.signal, token);
          if (confirmed && confirmed.paired) {
            info = confirmed;
            info.token = token;
          } else if (info.pairing_open) {
            // The stored token was replaced by a Re-pair in Blender.
            const fresh = await pair({ url, pid: info.pid });
            const retry = fresh ? await ping(url, stop.signal, fresh) : null;
            if (retry && retry.paired) { info = retry; info.token = fresh; }
          }
        }
      } else {
        info.token = tokens[tokenKey()] || null;
      }

      info.url = url;
      info.port = info.port || port;
      return info;
    } catch (err) {
      return null; // closed port, timeout or blocked -- all the same here
    } finally {
      clearTimeout(timer);
    }
  }

  async function ping(url, signal, token) {
    const headers = token ? { 'X-FigBlend-Token': token } : undefined;
    const res = await fetch(url + '/ping', { signal, headers });
    if (!res.ok) return null;
    const info = await res.json();
    return info.app === 'blender' ? info : null;
  }

  let scanning = false;

  async function pingBridge(quiet) {
    if (scanning) return;
    scanning = true;
    if (!quiet) linkText.textContent = 'Scanning…';
    try {
      const found = (await Promise.all(BRIDGE_PORTS.map(probe))).filter(Boolean);
      found.sort((a, b) => a.port - b.port);

      // Stay on the same instance across rescans, so a rescan cannot silently
      // retarget a different scene mid-session.
      const previous = bridge && bridge.pid;
      instances = found;
      bridge = found.find((i) => i.pid === previous) || found[0] || null;
      renderLink();
    } finally {
      scanning = false;
    }
  }

  // Keep looking in the background, so starting Live Link in Blender (or
  // saving the .blend) connects without touching the plugin. Often while
  // there is nothing to send to, rarely once there is.
  const WATCH_WAITING = 3000;
  const WATCH_CONNECTED = 15000;
  function watchBridge() {
    const ready = bridge && bridge.paired && bridge.blend_saved;
    setTimeout(async () => {
      if (!working) await pingBridge(true);
      watchBridge();
    }, ready ? WATCH_CONNECTED : WATCH_WAITING);
  }

  function label(info) {
    const name = info.blend_name || 'unsaved';
    return instances.length > 1 ? name + ' :' + info.port : name;
  }

  function renderLink() {
    const live = !!bridge;
    linkBtn.classList.toggle('paired', live && bridge.paired);
    linkBtn.classList.toggle('found', live && !bridge.paired);
    // Several Blenders: the pill becomes a picker, marked by its chevron.
    linkMore.classList.toggle('hidden', instances.length < 2);
    linkText.textContent = !live
      ? 'Offline'
      : !bridge.paired
        ? 'Pair'
        : bridge.blend_saved ? label(bridge) : 'Unsaved';

    linkBtn.title = !live
      ? 'No Blender found on ports ' + BRIDGE_PORTS[0] + '-'
        + BRIDGE_PORTS[BRIDGE_PORTS.length - 1]
        + ". Press Start Live Link in Blender's FigBlend tab, then click to rescan."
      : !bridge.paired
        ? 'Blender is listening but not paired with this plugin. Click Re-pair '
          + 'in its FigBlend panel, then click here to rescan.'
      : !bridge.blend_saved
        ? 'Blender is listening but the .blend is unsaved, so there is nowhere to put ./figAssets. Save it, then rescan.'
        : instances.length > 1
          ? instances.length + ' Blenders found. Pick which one receives the export.'
          : 'Connected to ' + bridge.blend_name + ' on port ' + bridge.port
            + '. Assets go to ' + bridge.asset_dir;

    if (!working) {
      exportBtn.lastChild.textContent = (live && bridge.paired && bridge.blend_saved)
        ? ' Send to Blender' : ' Export';
    }
    noteLinkChange(live);
  }

  // --- menus ---------------------------------------------------------------
  // One themed dropdown for the quality and Blender pickers. It opens inside
  // the plugin window, which grows to fit it rather than clipping the list.
  const app = document.getElementById('app');
  let openMenuState = null;

  function closeMenu() {
    if (!openMenuState) return;
    openMenuState.menu.remove();
    openMenuState.anchor.classList.remove('open');
    app.style.paddingBottom = '';
    document.removeEventListener('mousedown', openMenuState.outside, true);
    document.removeEventListener('keydown', openMenuState.keys, true);
    openMenuState = null;
  }

  function openMenu(anchor, options, current, onPick) {
    if (openMenuState && openMenuState.anchor === anchor) { closeMenu(); return; }
    closeMenu();
    const menu = document.createElement('div');
    menu.className = 'menu';
    menu.setAttribute('role', 'listbox');
    for (const option of options) {
      const item = document.createElement('button');
      item.type = 'button';
      item.setAttribute('role', 'option');
      if (String(option.value) === String(current)) item.className = 'sel';
      const text = document.createElement('span');
      text.textContent = option.label;
      item.appendChild(text);
      if (option.hint) {
        const hint = document.createElement('em');
        hint.textContent = option.hint;
        item.appendChild(hint);
      }
      item.onclick = (event) => { event.stopPropagation(); closeMenu(); onPick(option); };
      menu.appendChild(item);
    }
    app.appendChild(menu);
    const a = anchor.getBoundingClientRect();
    const box = app.getBoundingClientRect();
    menu.style.top = (a.bottom - box.top + 4) + 'px';
    menu.style.minWidth = a.width + 'px';
    // Right-aligned when that keeps it inside the window, else left-aligned.
    const left = Math.min(a.left - box.left, box.width - menu.offsetWidth);
    menu.style.left = Math.max(0, left) + 'px';
    const overflow = (a.bottom + 4 + menu.offsetHeight) - box.bottom;
    if (overflow > 0) app.style.paddingBottom = (overflow + 4) + 'px';
    anchor.classList.add('open');
    const outside = (event) => {
      if (!menu.contains(event.target) && !anchor.contains(event.target)) closeMenu();
    };
    const keys = (event) => {
      if (event.key === 'Escape') { closeMenu(); anchor.focus(); }
    };
    document.addEventListener('mousedown', outside, true);
    document.addEventListener('keydown', keys, true);
    openMenuState = { menu, anchor, outside, keys };
    (menu.querySelector('.sel') || menu.firstChild).focus();
  }

  linkBtn.onclick = () => {
    if (instances.length < 2) { pingBridge(); return; }
    openMenu(linkBtn,
      instances.map((info) => ({ value: info.pid, label: label(info) }))
        .concat([{ value: 'rescan', label: 'Rescan' }]),
      bridge && bridge.pid,
      (option) => {
        if (option.value === 'rescan') { pingBridge(); return; }
        bridge = instances.find((i) => i.pid === option.value) || bridge;
        renderLink();
      });
  };

  const rasterBtn = document.getElementById('rasterScale');
  const rasterText = document.getElementById('rasterText');
  const RASTER = [
    { value: 1, label: '1×', hint: 'Draft' },
    { value: 2, label: '2×' },
    { value: 3, label: '3×' },
    { value: 4, label: '4×', hint: 'Close-up' },
  ];
  rasterBtn.onclick = (event) => {
    event.stopPropagation();
    openMenu(rasterBtn, RASTER, rasterBtn.dataset.value, (option) => {
      rasterBtn.dataset.value = String(option.value);
      rasterText.textContent = option.label;
    });
  };

  const ppm = document.getElementById('pxPerMeter');
  for (const button of document.querySelectorAll('.stepper button')) {
    button.onclick = (event) => {
      event.preventDefault(); // inside the label, a click would refocus the input
      const step = Number(ppm.step) || 100;
      const value = Number(ppm.value) || 1000;
      // Snap to the step, so 1250 goes to 1300 rather than 1350.
      const next = Number(button.dataset.step) > 0
        ? Math.floor(value / step) * step + step
        : Math.ceil(value / step) * step - step;
      ppm.value = String(Math.max(Number(ppm.min) || 1, next));
    };
  }

  // One choice, not two switches: curves and baked planes are mutually
  // exclusive, and raster quality means something different under each --
  // "affects the icons" versus "is the resolution of everything, text included".
  let mode = 'texvector';

  function setMode(next) {
    mode = next;
    for (const btn of modeSeg.querySelectorAll('button')) {
      btn.classList.toggle('on', btn.dataset.mode === mode);
    }
    qualityTip.dataset.tip = mode === 'image'
      ? 'Resolution of every element, text included. Raise it for close-up shots.'
      : mode === 'texvector'
        ? 'Resolution of the texture on every shape. Raise it for close-up shots.'
        : 'Resolution of icons, images and effects. Text and vector shapes are unaffected.';
  }

  modeSeg.onclick = (event) => {
    const btn = event.target.closest('button');
    if (btn) setMode(btn.dataset.mode);
  };
  setMode('texvector');
  pingBridge();
  watchBridge();

  const updateBtn = document.getElementById('update');
  const updateText = document.getElementById('updateText');
  updateBtn.onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'open-release' } }, '*');
  };

  // --- feedback ------------------------------------------------------------
  // Three channels, each doing one job: the Export button says what is
  // happening right now, Figma's toast says how it ended, and the log in
  // Settings keeps every line in full -- warnings included, which used to be
  // a count pointing at the developer console.

  let working = false;

  function busy(label) {
    working = true;
    exportBtn.disabled = true;
    exportBtn.lastChild.textContent = ' ' + label;
  }

  function idle() {
    working = false;
    exportBtn.disabled = false;
    renderLink();
  }

  function notify(text, isError) {
    parent.postMessage({ pluginMessage: { type: 'notify', text, error: !!isError } }, '*');
  }

  const LOG_LIMIT = 200;

  function log(text, level) {
    const empty = logEl.querySelector('.empty');
    if (empty) empty.remove();
    const line = document.createElement('div');
    if (level) line.className = level === 'error' ? 'e' : 'w';
    const time = document.createElement('span');
    time.className = 't';
    time.textContent = new Date().toTimeString().slice(0, 8) + '  ';
    line.append(time, document.createTextNode(text));
    logEl.appendChild(line);
    while (logEl.children.length > LOG_LIMIT) logEl.firstChild.remove();
    logEl.scrollTop = logEl.scrollHeight;
    // An error nobody has seen tints the gear until Settings is opened.
    if (level === 'error' && settingsEl.classList.contains('hidden')) {
      settingsBtn.classList.add('alert');
    }
  }

  // Rescans happen often; only a change in what is connected is news.
  let lastLink = null;
  function noteLinkChange(live) {
    const now = !live ? 'offline'
      : !bridge.paired ? 'unpaired:' + bridge.port
      : 'paired:' + bridge.port + ':' + (bridge.blend_name || '');
    if (now === lastLink) return;
    if (lastLink !== null || now !== 'offline') {
      log(!live ? 'No Blender found on ports ' + BRIDGE_PORTS[0] + '-'
                  + BRIDGE_PORTS[BRIDGE_PORTS.length - 1]
        : !bridge.paired ? 'Blender found on port ' + bridge.port + ' but not paired'
        : 'Connected to ' + (bridge.blend_name || 'Blender') + ' on port ' + bridge.port);
    }
    lastLink = now;
  }

  settingsBtn.onclick = () => {
    const open = settingsEl.classList.toggle('hidden') === false;
    settingsBtn.classList.toggle('on', open);
    settingsBtn.setAttribute('aria-expanded', String(open));
    if (open) {
      settingsBtn.classList.remove('alert');
      logEl.scrollTop = logEl.scrollHeight;
    }
  };

  getAddonBtn.onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'open-addon' } }, '*');
  };

  // The window is as tall as its content: no empty space when idle, and a
  // long status or a second Blender in the picker never gets clipped. The
  // main thread owns the window, so the height goes there to be applied.
  const PAD = 20;  // body padding, top and bottom
  new ResizeObserver(() => {
    const height = Math.ceil(app.getBoundingClientRect().height) + PAD;
    parent.postMessage({ pluginMessage: { type: 'resize', height } }, '*');
  }).observe(app);

  exportBtn.onclick = () => {
    busy('Reading…');
    parent.postMessage({ pluginMessage: {
      type: 'export',
      pxPerMeter: Number(document.getElementById('pxPerMeter').value) || 1000,
      rasterScale: Number(rasterBtn.dataset.value) || 2,
      mode,
    }}, '*');
  };


  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'update') {
      updateText.textContent = msg.version;
      updateBtn.title = 'FigBlend ' + msg.version + ' is out. Click for the '
        + 'release page, then unzip the plugin over this folder -- Figma '
        + 'loads the new files next time it runs.';
      updateBtn.classList.remove('hidden');
      return;
    }
    if (msg.type === 'info') {
      versionEl.textContent = 'FigBlend ' + msg.version;
      getAddonBtn.disabled = !msg.addonAvailable;
      getAddonBtn.title = msg.addonAvailable
        ? 'Download the FigBlend ' + msg.version + ' add-on for Blender 4.2+ — the '
          + 'version made to work with this plugin'
        : 'No release repository is set for this build';
      return;
    }
    if (msg.type === 'token') {
      tokens[msg.key] = msg.value;
      const resolve = tokenWaiters[msg.key + ':resolve'];
      if (resolve) {
        resolve(msg.value);
        delete tokenWaiters[msg.key + ':resolve'];
        delete tokenWaiters[msg.key];
      }
      return;
    }
    if (msg.type === 'progress') {
      return; // the button already says Reading; per-frame steps are noise
    }
    if (msg.type === 'error') {
      idle();
      log(msg.message, 'error');
      notify(msg.message, true);
      return;
    }
    if (msg.type === 'bundle') {
      busy('Packing…');
      const files = [{ path: 'bundle.json', bytes: strToBytes(msg.manifest) }].concat(msg.assets);
      const zip = buildZip(files);

      // Composed before delivering, because deliver() is async and would
      // otherwise have its own message overwritten by this one.
      let text = `${msg.stats.nodes} nodes, ${msg.stats.assets} assets.`;
      if (msg.stats.strokesOutlined) {
        text += ` Outlined ${msg.stats.strokesOutlined} stroke(s).`;
      }
      if (msg.stats.effectsDropped) {
        text += ` Effects dropped on ${msg.stats.effectsDropped} shape(s) — relight in Blender.`;
      }
      for (const warning of msg.warnings) log(warning, 'warn');
      if (msg.warnings.length) text += ` ${msg.warnings.length} warning(s).`;

      deliver(zip, msg.filename, text, msg.warnings.length).finally(idle);
    }
  };

  // Straight into Blender when it is listening, otherwise the usual download.
  // A failed send falls back rather than losing the export.
  async function deliver(zip, filename, stats, warnings) {
    // The toast is all most people read, so it says when the log has more.
    const more = warnings
      ? ' — ' + warnings + ' warning' + (warnings > 1 ? 's' : '') + ', see Settings'
      : '';
    if (bridge && bridge.paired && bridge.blend_saved) {
      busy('Sending…');
      try {
        let res = await send(zip, filename, bridge.token);
        // The token can expire out from under us -- Blender restarted, or Live
        // Link was stopped and started again. Pair once more and retry before
        // giving up on the send.
        if (res.status === 401) {
          const token = await pair(bridge);
          if (token) {
            bridge.token = token;
            res = await send(zip, filename, token);
          }
        }
        const info = await res.json().catch(() => ({}));
        if (res.ok) {
          const where = bridge.blend_name || 'Blender';
          log('Sent ' + filename + ' to ' + where + ' — ' + stats);
          notify('Sent to ' + where + more);
          return;
        }
        if (res.status === 401) {
          fail('Not paired with Blender — click Re-pair in its FigBlend panel, '
               + 'then Export again. Downloaded ' + filename + ' instead.');
          pingBridge();
          download(zip, filename);
          return;
        }
        fail((info.error || 'Blender refused the bundle.') + ' Downloaded ' + filename + ' instead.');
      } catch (err) {
        fail('Could not reach Blender — downloaded ' + filename + ' instead.');
      }
      pingBridge(); // the link may have dropped; refresh what we show
      download(zip, filename);
      return;
    }
    download(zip, filename);
    log('Exported ' + filename + ' — ' + stats);
    notify('Exported ' + filename + more);
  }

  function fail(text) {
    log(text, 'error');
    notify(text, true);
  }

  function send(zip, filename, token) {
    const headers = {
      'Content-Type': 'application/zip',
      'X-Bundle-Name': filename,
    };
    if (token) headers['X-FigBlend-Token'] = token;
    return fetch(bridge.url + '/import', { method: 'POST', headers, body: zip });
  }

  function download(bytes, filename) {
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/zip' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  function strToBytes(str) {
    return new TextEncoder().encode(str);
  }

  // --- Minimal store-only ZIP writer -------------------------------------
  // No compression: PNGs are already deflated and bundle.json is small, so the
  // savings do not justify shipping a zip library into the plugin sandbox.

  const CRC_TABLE = (() => {
    const table = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      table[i] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function u16(n) { return [n & 0xFF, (n >>> 8) & 0xFF]; }
  function u32(n) { return [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]; }

  function buildZip(files) {
    const now = new Date();
    const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

    const chunks = [];
    const central = [];
    let offset = 0;

    for (const file of files) {
      const name = strToBytes(file.path);
      const data = file.bytes instanceof Uint8Array ? file.bytes : new Uint8Array(file.bytes);
      const crc = crc32(data);

      // 0x0800 = filenames are UTF-8
      const local = [].concat(
        u32(0x04034b50), u16(20), u16(0x0800), u16(0),
        u16(dosTime), u16(dosDate),
        u32(crc), u32(data.length), u32(data.length),
        u16(name.length), u16(0),
      );
      chunks.push(new Uint8Array(local), name, data);

      central.push([].concat(
        u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0),
        u16(dosTime), u16(dosDate),
        u32(crc), u32(data.length), u32(data.length),
        u16(name.length), u16(0), u16(0), u16(0), u16(0),
        u32(0), u32(offset),
      ));
      central.push(name);

      offset += local.length + name.length + data.length;
    }

    const centralChunks = central.map((c) => (c instanceof Uint8Array ? c : new Uint8Array(c)));
    const centralSize = centralChunks.reduce((sum, c) => sum + c.length, 0);

    const eocd = new Uint8Array([].concat(
      u32(0x06054b50), u16(0), u16(0),
      u16(files.length), u16(files.length),
      u32(centralSize), u32(offset), u16(0),
    ));

    return concat(chunks.concat(centralChunks, [eocd]));
  }

  function concat(arrays) {
    const total = arrays.reduce((sum, a) => sum + a.length, 0);
    const out = new Uint8Array(total);
    let pos = 0;
    for (const a of arrays) { out.set(a, pos); pos += a.length; }
    return out;
  }

  // Last, so every handler above exists before the main thread starts talking.
  parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');
</script>
